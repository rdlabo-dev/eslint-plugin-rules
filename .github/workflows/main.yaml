name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: "${{ (needs.ci-reuse.result != 'success' && !cancelled()) || ((success()) && needs.ci-reuse.outputs.reuse != 'true') }}"
    needs:
      - ci-reuse
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - angular: 21
            typescript: ~5.9.0
          - angular: 22
            typescript: ~6.0.0
    steps:
      - name: Fail if tree verification failed
        if: needs.ci-reuse.result != 'success'
        run: exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install compatibility dependencies
        run: npm install --no-save --package-lock=false @angular-eslint/template-parser@${{ matrix.angular }} @angular-eslint/test-utils@${{ matrix.angular }} @angular/common@${{ matrix.angular }} @angular/compiler@${{ matrix.angular }} @angular/core@${{ matrix.angular }} @angular/forms@${{ matrix.angular }} @angular/platform-browser@${{ matrix.angular }} @angular/router@${{ matrix.angular }} @ionic/core@9 typescript@${{ matrix.typescript }}
      - name: Install Ionic Angular peer fixture
        run: npm install --prefix /tmp/ionic-angular-${{ matrix.angular }} --no-save @ionic/angular@9 @angular/common@${{ matrix.angular }} @angular/compiler@${{ matrix.angular }} @angular/core@${{ matrix.angular }} @angular/forms@${{ matrix.angular }} @angular/platform-browser@${{ matrix.angular }} @angular/router@${{ matrix.angular }} rxjs@7
      - name: Verify compatibility dependency versions
        run: node scripts/check-compatibility-versions.mjs ${{ matrix.angular }} ${{ matrix.typescript }} /tmp/ionic-angular-${{ matrix.angular }}
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
        env:
          CI: true
      - name: Build
        run: npm run build

  ci-reuse:
    name: Verify tested tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test CI reuse guards
        run: node --test .github/scripts/ci-tree-reuse.test.mjs
      - name: Record the actual complete checkout
        id: tree
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { execFileSync } = await import('node:child_process');
            const { writeFileSync } = await import('node:fs');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const tree = git('rev-parse', 'HEAD^{tree}');
            const commit = git('rev-parse', 'HEAD');
            core.setOutput('tree', tree);
            core.setOutput('commit', commit);
            writeFileSync(`${process.env.RUNNER_TEMP}/ci-tree.txt`, `${commit}\n${tree}\n`);
      - name: Reuse only the latest successful PR CI for this tree
        id: lookup
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          TREE: ${{ steps.tree.outputs.tree }}
        with:
          script: |
            const { resolveReuse } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-tree-reuse.mjs`);
            const result = await resolveReuse(github, context, process.env.TREE, 'main.yaml');
            core.setOutput('reuse', String(result.reuse));
            if (result.reuse) {
              await core.summary.addHeading('Reused PR validation').addLink('Latest successful PR CI', result.url)
                .addRaw(`\n\nComplete repository tree: ${result.tree}\n`).write();
            } else {
              core.info(result.reason);
            }
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs:
      - ci-reuse
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require executed tests or verified reuse
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          NEEDS: ${{ toJSON(needs) }}
          REUSE: ${{ needs.ci-reuse.outputs.reuse }}
        with:
          script: |
            const { requireResults } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-tree-reuse.mjs`);
            requireResults(process.env.REUSE === 'true', JSON.parse(process.env.NEEDS), ["build"], []);
      - name: Record the actual complete checkout
        id: tree
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { execFileSync } = await import('node:child_process');
            const { writeFileSync } = await import('node:fs');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const tree = git('rev-parse', 'HEAD^{tree}');
            const commit = git('rev-parse', 'HEAD');
            core.setOutput('tree', tree);
            core.setOutput('commit', commit);
            writeFileSync(`${process.env.RUNNER_TEMP}/ci-tree.txt`, `${commit}\n${tree}\n`);
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && !contains(needs.*.result, 'skipped')
      - name: Record PR checkout evidence
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && !contains(needs.*.result, 'skipped')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-tree-pr-${{ github.event.pull_request.number }}-${{ steps.tree.outputs.tree }}-${{ steps.tree.outputs.commit
            }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tree.txt
          if-no-files-found: error
          retention-days: 30
